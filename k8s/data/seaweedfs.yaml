apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: seaweedfs, namespace: data}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-s3", "-s3.config=/etc/s3/s3.json",
                 "-master.volumeSizeLimitMB=256", "-volume.max=40", "-ip.bind=0.0.0.0"]
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 9333, name: master}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/s3}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}

